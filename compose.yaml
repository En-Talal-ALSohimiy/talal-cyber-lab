services:
  app:
    build: {context: ., target: app}
    ports: ["127.0.0.1:3210:3210"]
    environment:
      LAB_ORIGIN: http://localhost:3210
      LAB_WORKER_URL: http://worker:3211
      LAB_WORKER_TOKEN: ${LAB_WORKER_TOKEN:?Run ./install.sh first}
    volumes: ["lab-data:/data"]
    read_only: true
    tmpfs: ["/tmp:size=64m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    networks: [control]
    depends_on: [worker]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3210/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build: {context: ., target: worker}
    environment:
      LAB_WORKER_TOKEN: ${LAB_WORKER_TOKEN:?Run ./install.sh first}
      LAB_TARGETS: '{"training":"training-target"}'
    read_only: true
    tmpfs: ["/tmp:size=128m,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    networks: [control, simulation]
  training-target:
    image: node:24-bookworm-slim
    user: node
    command: [node, -e, "require('node:http').createServer((q,s)=>{s.setHeader('content-type','text/plain');s.end('Talal synthetic training target')}).listen(8080,'0.0.0.0')"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    networks: [simulation]
networks:
  control: {internal: true}
  simulation: {internal: true}
volumes:
  lab-data:

