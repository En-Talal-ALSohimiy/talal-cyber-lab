name: Linux build and acceptance
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build isolated Linux laboratory
        run: bash install.sh
      - name: Check installed tools and live execution
        run: docker compose exec -T app node local/acceptance.mjs
      - name: Stop test laboratory
        if: always()
        run: docker compose down --volumes

